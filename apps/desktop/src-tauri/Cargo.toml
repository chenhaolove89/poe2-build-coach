[package]
name = "poe2-build-coach"
version = "0.1.0"
description = "PoE2 Build Coach - follow any build step by step"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
