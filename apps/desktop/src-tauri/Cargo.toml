[package]
name = "poe2-build-coach"
version = "0.1.0"
description = "PoE2 Build Coach - follow any build step by step"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Needs >= 2.4, which is where WebviewWindow::cookies_for_url landed; that is
# what 关联登录 uses to read the session cookie out of the login window.
tauri = { version = "2", features = [] }
# The trade site and poe.ninja send no CORS headers, so requests have to leave
# through Rust instead of the webview.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"

# Used to ask the running game where its executable lives, which is the only
# reliable way to find Client.txt on 国服: WeGame installs games under its own
# tree, not under Program Files. Windows-only, so Linux CI still builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
